# 声纹识别模型统一配置文件
# 所有使用模型的地方都从此配置文件读取参数

# 模型选择配置
model_selection:
  # 指定要使用的模型（设置为 null 则自动使用最新模型）
  # 推荐使用性能最好的模型: speechbrain_model_20251214_160747 (验证准确率: 89.40%)
  selected_model: "speechbrain_model_20251214_140340"  # 或 null 表示自动选择最新模型
  
  # 模型路径配置（相对于项目根目录）
  models_dir: "backend/training/models"
  encoder_root: "backend/training/model/speechbrain"

# 音频参数配置
audio:
  sample_rate: 16000  # 采样率（Hz）
  bit_depth: 16       # 位深度
  channels: 1         # 声道数（单声道）

# 识别参数配置
recognition:
  similarity_threshold: 0.75  # 相似度阈值（推荐使用模型校准报告中的推荐值）
  num_mfcc: 13                 # MFCC特征数量
  multi_speaker: true          # 是否支持多说话人识别

# 音频文件配置
file:
  max_audio_size: 524288000  # 最大音频文件大小（字节，500MB）
  allowed_extensions: [".wav", ".mp3", ".mp4", ".m4a", ".webm", ".ogg", ".flac"]  # 允许的音频文件扩展名

